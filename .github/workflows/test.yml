name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1.336.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        rubygems: latest
    - run: bundle exec rspec
